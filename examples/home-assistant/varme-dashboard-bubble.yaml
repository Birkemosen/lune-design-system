# Eksempel: varme-dashboard med Bubble Card (HACS) i LDS-stil (DESIGN.md 14.3).
# Overblik som Touch' Hjem: kort med farvet ikonbrik (domænets fyld-tone) og ét hovedtal,
# små neutrale ekstra værdier; et tryk åbner tingens ark = Bubble pop-up (#varme, #cirkulation,
# #vejr, #energi, #stueetage, #1sal) med de lange grafer. Historik-visningen er den indbyggede.
# Kræver Bubble Card ≥ 3.2 (standalone pop-ups). Farver: var(--lune-*, LDS-fyldtone) — temaet
# "Lune" (tools/lds_ha.py) sætter --lune-* og --bubble-*; uden det bruges LDS' faste fyldtoner.
# Erstat entity-id'erne med dine egne.
title: Varme
views:
- title: Overblik
  path: overblik
  icon: mdi:home-thermometer
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:bubble-card
      card_type: separator
      name: Huset
      icon: mdi:home
      grid_options:
        columns: full
    - type: custom:bubble-card
      card_type: climate
      entity: climate.ecodan_heatpump_virtual_thermostat_z1
      name: Huset
      icon: mdi:home-thermometer
      show_state: false
      state_color: true
      grid_options:
        columns: 24
      sub_button:
      - entity: sensor.ecodan_heatpump_outside_temp
        show_state: true
        show_icon: true
        show_background: true
        name: Ude
        show_name: false
        icon: mdi:weather-partly-cloudy
      styles: '.bubble-icon-container { background: var(--lune-heat-fill, #e8630a) !important; opacity: 1 !important; }

        .bubble-icon { color: var(--lune-on-fill, #ffffff) !important; --icon-primary-color: var(--lune-on-fill, #ffffff) !important; opacity: 1 !important; }

        .bubble-sub-button { background-color: var(--lune-raised, var(--secondary-background-color)) !important; color: var(--primary-text-color) !important; }

        .bubble-sub-button .bubble-sub-button-icon { color: var(--secondary-text-color) !important; }

        .bubble-background { opacity: 0 !important; }

        '
    - type: custom:bubble-card
      card_type: button
      button_type: state
      entity: weather.forecast_home
      name: Vejret
      icon: mdi:weather-partly-cloudy
      show_state: true
      show_name: true
      show_icon: true
      styles: '.bubble-icon-container { background: var(--lune-info-fill, #2e72a0) !important; opacity: 1 !important; }

        .bubble-icon { color: var(--lune-on-fill, #ffffff) !important; --icon-primary-color: var(--lune-on-fill, #ffffff) !important; opacity: 1 !important; }

        .bubble-sub-button { background-color: var(--lune-raised, var(--secondary-background-color)) !important; color: var(--primary-text-color) !important; }

        .bubble-sub-button .bubble-sub-button-icon { color: var(--secondary-text-color) !important; }

        '
      tap_action:
        action: navigate
        navigation_path: '#vejr'
      button_action:
        tap_action:
          action: navigate
